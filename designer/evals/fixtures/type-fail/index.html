<!doctype html>
<!-- designer lint fixture: type rules. Expected PATCH (type). -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tidewater ferry timetable</title>
<style>
:root { --ink: #1b1d1f; --paper: #eef1f2; --accent: #1f6f8b; --font-display: "Montserrat", sans-serif; --font-body: "Public Sans", sans-serif; }
html, body { overflow-x: clip; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); }
h1, h2 { font-family: var(--font-display); }
.nav-link { font-size: 13px; text-transform: uppercase; letter-spacing: 0.12em; }
.accent { color: var(--accent); }
</style>
</head>
<body>
<section class="hero">
  <h1>Cross the sound <em>tonight</em></h1>
  <p>Sailings every forty minutes from Pier 3.</p>
</section>
<section>
  <h2>Fares for <span class="accent">every</span> crossing</h2>
  <a class="nav-link" href="/fares">Fares</a>
</section>
</body>
</html>
